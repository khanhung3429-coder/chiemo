<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho code</title>
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#17201c;--mute:#66726c;--line:#d9dfdc;--accent:#0f6b55;--accent-ink:#fff;--code:#101815;--code-ink:#d7efe4;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1311;--panel:#161d1a;--ink:#e6eeea;--mute:#8d9b94;--line:#26312c;--accent:#3ec9a0;--accent-ink:#06201a;--code:#080c0a;--code-ink:#cfeee0;--danger:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.1rem;margin:0 0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
textarea{font-family:Consolas,"Courier New",monospace;font-size:.9rem;min-height:150px;resize:vertical;tab-size:2}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}.row>.grow{flex:1 1 180px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.mute{color:var(--mute);font-size:.9rem}
.err{color:var(--danger);min-height:1.3em;font-size:.9rem;margin:4px 0 0}
#auth{max-width:380px;margin:8vh auto 0}
.hidden{display:none!important}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.item-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.item-head .name{flex:1 1 140px;min-width:0;text-align:left;border:0;background:none;padding:6px 0;font-weight:600;overflow-wrap:anywhere}
.item-head .name::before{content:"▸ ";color:var(--mute)}
.item-head .name[aria-expanded="true"]::before{content:"▾ "}
.item-head button.sm{padding:4px 10px;font-size:.88rem}
.item pre{margin-top:8px}
pre{margin:0;background:var(--code);color:var(--code-ink);border-radius:8px;padding:12px;overflow:auto;max-height:320px;font:.85rem/1.5 Consolas,"Courier New",monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

<section id="auth" class="panel">
  <h1>Kho code</h1>
  <p class="mute">Nhập tên đăng nhập và mật khẩu để lưu code và file của bạn.</p>
  <input id="email" type="text" placeholder="Tên đăng nhập" autocomplete="username" autocapitalize="none" spellcheck="false">
  <input id="pass" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password">
  <div class="row">
    <button class="primary grow" id="btnLogin">Đăng nhập</button>
    <button class="grow" id="btnSignup">Tạo tài khoản</button>
  </div>
  <p class="err" id="authErr"></p>
</section>

<main id="app" class="hidden">
  <header>
    <h1>Kho code</h1>
    <div class="row"><span class="mute" id="who"></span><button id="btnOut">Đăng xuất</button></div>
  </header>

  <section class="panel">
    <h2>Lưu mới</h2>
    <input id="title" placeholder="Tên (ví dụ: hàm sắp xếp.js)">
    <textarea id="content" placeholder="Dán code hoặc văn bản vào đây" spellcheck="false"></textarea>
    <div class="row">
      <button class="primary" id="btnSave">Lưu</button>
      <button id="btnPick">Tải file lên</button>
      <input id="file" type="file" class="hidden" multiple>
      <span class="mute">File văn bản/code, tối đa khoảng 900 KB mỗi file.</span>
    </div>
    <p class="err" id="saveErr"></p>
  </section>

  <section>
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">Đã lưu</h2>
      <input class="grow" id="search" placeholder="Tìm theo tên hoặc nội dung" style="margin:0">
    </div>
    <div id="list"></div>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCnf211JJoVx-t91gYpj1w742vSoDRm_r0",
  authDomain: "code-9b836.firebaseapp.com",
  projectId: "code-9b836",
  storageBucket: "code-9b836.firebasestorage.app",
  messagingSenderId: "225486517881",
  appId: "1:225486517881:web:24f454d5ac21d600d706a8",
  measurementId: "G-6CFJJ4KW1M"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let unsub = null, items = [], user = null;

const msgs = {
  "auth/invalid-credential":"Tên đăng nhập hoặc mật khẩu không đúng.",
  "auth/invalid-email":"Tên đăng nhập không hợp lệ.",
  "auth/email-already-in-use":"Tên đăng nhập này đã có người dùng. Hãy chọn tên khác hoặc đăng nhập.",
  "auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.",
  "auth/popup-closed-by-user":"Bạn đã đóng cửa sổ đăng nhập.",
  "auth/operation-not-allowed":"Chưa bật phương thức này trong Firebase Console (Authentication → Sign-in method).",
  "auth/unauthorized-domain":"Tên miền này chưa được thêm vào Authentication → Settings → Authorized domains.",
  "permission-denied":"Bị từ chối quyền. Kiểm tra Firestore Rules."
};
const errText = e => msgs[e.code] || e.message;

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1500)}

async function copy(text){
  try{await navigator.clipboard.writeText(text)}
  catch{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
  toast("Đã sao chép");
}

// Đăng nhập
const DOMAIN = "@khocode.app"; // email ảo, người dùng không cần biết
function toEmail(){
  const name = $("email").value.trim().toLowerCase();
  if (!/^[a-z0-9._-]{3,30}$/.test(name)) throw {message:"Tên đăng nhập gồm 3–30 ký tự: chữ không dấu, số, dấu . _ -"};
  return name + DOMAIN;
}
const run = async (fn) => { $("authErr").textContent=""; try{await fn()}catch(e){$("authErr").textContent=errText(e)} };
$("btnLogin").onclick = () => run(()=>signInWithEmailAndPassword(auth,toEmail(),$("pass").value));
$("btnSignup").onclick = () => run(()=>createUserWithEmailAndPassword(auth,toEmail(),$("pass").value));
$("btnOut").onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  $("auth").classList.toggle("hidden", !!u);
  $("app").classList.toggle("hidden", !u);
  if (unsub) { unsub(); unsub = null; }
  if (!u) { items = []; return; }
  $("who").textContent = (u.email || "").replace(DOMAIN,"");
  const q = query(collection(db,"users",u.uid,"snippets"), orderBy("createdAt","desc"));
  unsub = onSnapshot(q, snap => { items = snap.docs.map(d=>({id:d.id,...d.data()})); render(); },
    e => { $("saveErr").textContent = errText(e); });
});

// Lưu
async function save(title, content){
  await addDoc(collection(db,"users",user.uid,"snippets"), {title, content, createdAt: serverTimestamp()});
}
$("btnSave").onclick = async () => {
  const title = $("title").value.trim() || "Không tên";
  const content = $("content").value;
  $("saveErr").textContent = "";
  if (!content.trim()) { $("saveErr").textContent = "Hãy nhập nội dung trước khi lưu."; return; }
  if (content.length > 900000) { $("saveErr").textContent = "Nội dung quá lớn (tối đa khoảng 900 KB)."; return; }
  $("btnSave").disabled = true;
  try { await save(title, content); $("title").value=""; $("content").value=""; toast("Đã lưu"); }
  catch(e){ $("saveErr").textContent = errText(e); }
  $("btnSave").disabled = false;
};

$("btnPick").onclick = () => $("file").click();
$("file").onchange = async e => {
  $("saveErr").textContent = "";
  for (const f of e.target.files) {
    if (f.size > 900000) { $("saveErr").textContent = `"${f.name}" quá lớn (tối đa khoảng 900 KB).`; continue; }
    try { await save(f.name, await f.text()); toast("Đã lưu " + f.name); }
    catch(err){ $("saveErr").textContent = errText(err); }
  }
  e.target.value = "";
};

// Hiển thị
const open = new Set();
function render(){
  const k = $("search").value.trim().toLowerCase();
  const list = $("list"); list.innerHTML = "";
  const shown = items.filter(i => !k || i.title.toLowerCase().includes(k) || i.content.toLowerCase().includes(k));
  if (!shown.length) {
    const p = document.createElement("p"); p.className="mute";
    p.textContent = items.length ? "Không có mục nào khớp." : "Chưa có gì. Dán code hoặc tải file lên ở trên để lưu.";
    list.appendChild(p); return;
  }
  const mk = (txt, cls, fn) => { const b=document.createElement("button"); b.className=cls; b.textContent=txt; b.onclick=fn; return b; };
  for (const i of shown) {
    const box = document.createElement("article"); box.className="item";
    const head = document.createElement("div"); head.className="item-head";
    const name = mk(i.title, "name", () => {
      const on = !open.has(i.id);
      on ? open.add(i.id) : open.delete(i.id);
      pre.classList.toggle("hidden", !on);
      name.setAttribute("aria-expanded", on);
    });
    const btns = document.createElement("div"); btns.className="row";
    btns.append(
      mk("Sao chép", "sm primary", () => copy(i.content)),
      mk("Đổi tên", "sm", async () => {
        const t = prompt("Tên mới:", i.title);
        if (t === null || !t.trim() || t.trim() === i.title) return;
        try { await updateDoc(doc(db,"users",user.uid,"snippets",i.id), {title:t.trim()}); toast("Đã đổi tên"); }
        catch(e){ toast(errText(e)); }
      }),
      mk("Tải về", "sm", () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([i.content],{type:"text/plain"}));
        a.download = i.title; a.click(); URL.revokeObjectURL(a.href);
      }),
      mk("Xóa", "sm danger", async () => {
        if (confirm(`Xóa "${i.title}"?`)) { try{await deleteDoc(doc(db,"users",user.uid,"snippets",i.id))}catch(e){toast(errText(e))} }
      })
    );
    const pre = document.createElement("pre"); pre.textContent = i.content;
    const isOpen = open.has(i.id);
    pre.classList.toggle("hidden", !isOpen);
    name.setAttribute("aria-expanded", isOpen);
    head.append(name,btns); box.append(head,pre); list.appendChild(box);
  }
}
$("search").oninput = render;
</script>
</body>
</html>
